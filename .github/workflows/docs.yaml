name: docs
on:
  push:
    branches: [develop, main]
    paths:
      - 'docs/**'
      - 'mkdocs.yaml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yaml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict -f mkdocs.yaml

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs gh-deploy --strict --force -f mkdocs.yaml
