version: 2

updates:
  # TypeScript, ESLint, VS Code API types, and the VSIX packaging tool.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      npm-development-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint currently supports TypeScript versions below 6.1.
      # Keep TypeScript on the latest compatible 6.0.x release until that peer
      # dependency range is widened upstream.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build(deps)

  # Actions used by the CI, documentation, and VSIX release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci(deps)

  # MkDocs and Material theme versions in requirements-docs.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: Europe/Rome
    versioning-strategy: increase
    open-pull-requests-limit: 3
    groups:
      documentation-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: docs(deps)
